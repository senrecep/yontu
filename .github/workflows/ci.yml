name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Unit tests
        run: python -m unittest discover -s tests

      - name: Version consistency
        run: python scripts/check-versions.py

      - name: Lint own Turkish docs
        run: |
          python skills/yontu/scripts/yontu lint README.tr.md
          python skills/yontu/scripts/yontu lint skills/yontu/SKILL.md

  test-py39:
    # Ubuntu runner images no longer ship 3.9; use the official image.
    name: Test (Python 3.9, container)
    runs-on: ubuntu-latest
    container: python:3.9-slim
    steps:
      - uses: actions/checkout@v7

      - name: Unit tests
        run: python -m unittest discover -s tests
