name: Release

# One file on purpose: PyPI trusted publishing does not accept reusable workflows,
# and tags created with GITHUB_TOKEN do not start other workflows.
# release-please opens a release PR on main; merging it creates the tag and the
# GitHub release, and the jobs below (gated on release_created) publish it.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Sigstore signing for the attestations only; nothing is published here
      attestations: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Unit tests
        run: python -m unittest discover -s tests

      - name: Version consistency
        run: python scripts/check-versions.py --tag "$TAG"

      # Before the wheel build: `python -m build` writes yontu.egg-info into the skill folder.
      - name: Build skill zip
        run: |
          sh scripts/package-skill.sh yontu-skill.zip
          unzip -Z1 yontu-skill.zip | grep -qx 'yontu/SKILL.md'
          if unzip -Z1 yontu-skill.zip | grep -qE 'egg-info|__pycache__|\.pyc$'; then echo "unexpected files in skill zip"; exit 1; fi

      - name: Build wheel and sdist
        run: |
          python -m pip install "build==1.6.1" "twine==7.0.0"
          python -m build --outdir dist
          python -m twine check dist/*

      - name: Smoke-test the wheel in a clean venv
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/bin/yontu" --version | grep -qx "yontu ${TAG#v}"
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            | "$RUNNER_TEMP/venv/bin/yontu" mcp | grep -q '"name": *"yontu"'

      - name: Checksums
        run: |
          (cd dist && sha256sum *) > SHA256SUMS
          sha256sum yontu-skill.zip >> SHA256SUMS
          cat SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*
            yontu-skill.zip

      - uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: |
            dist/*
            yontu-skill.zip
            SHA256SUMS
          if-no-files-found: error

  publish-pypi:
    needs: [release-please, build]
    runs-on: ubuntu-latest
    # Must match the environment on the PyPI pending/trusted publisher.
    environment:
      name: pypi
      url: https://pypi.org/project/yontu/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-files
          path: out

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: out/dist
          skip-existing: true

  upload-release-assets:
    needs: [release-please, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-files
          path: out

      - name: Attach files to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" out/dist/* out/yontu-skill.zip out/SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"

  publish-mcp-registry:
    needs: [release-please, publish-pypi]
    runs-on: ubuntu-latest
    environment: mcp-registry
    permissions:
      id-token: write # GitHub OIDC login for the io.github.senrecep/* namespace
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.7 # bump deliberately; an old binary fails with "invalid audience"
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Wait for the PyPI release to be visible
        run: |
          version="${TAG#v}"
          for i in $(seq 1 30); do
            if curl --fail --silent --output /dev/null "https://pypi.org/pypi/yontu/${version}/json"; then
              echo "yontu ${version} is on PyPI"
              exit 0
            fi
            echo "attempt ${i}/30: not visible yet, retrying in 20s"
            sleep 20
          done
          echo "yontu ${version} did not appear on PyPI" >&2
          exit 1

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Publish server.json
        run: |
          # The registry reads the package's README from PyPI right after upload; retry on propagation errors.
          ./mcp-publisher login github-oidc
          for i in 1 2 3 4 5; do
            ./mcp-publisher publish && exit 0
            echo "publish attempt ${i}/5 failed, retrying in 30s"
            sleep 30
          done
          exit 1
